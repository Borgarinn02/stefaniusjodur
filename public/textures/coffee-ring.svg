<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <radialGradient id="pool" cx="48%" cy="52%" r="50%">
      <stop offset="0" stop-color="#8a5a2b" stop-opacity="0.05"/>
      <stop offset="0.85" stop-color="#8a5a2b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8a5a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#rough)">
    <circle cx="200" cy="200" r="150" fill="url(#pool)"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#6e4220" stroke-opacity="0.22" stroke-width="5"/>
    <circle cx="203" cy="197" r="146" fill="none" stroke="#6e4220" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="380 120 200 60"/>
  </g>
</svg>
